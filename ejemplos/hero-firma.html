<!-- ══════════════════════ COPIA DESDE AQUÍ ══════════════════════ -->
<style>
/* Hero "Firma" · fondo transparente, se monta sobre el que ustedes ya tienen.
   Todo va con prefijo .hf- para no chocar con tus estilos.                  */
.hf{
  --hf-champan:#E3BC72;
  --hf-oro:#C08F2E;
  --hf-humo:#F2F1EF;
  --hf-tinta:#1C2440;

  /* colores en uso — sobre fondo oscuro */
  --hf-firma:var(--hf-champan);
  --hf-texto:var(--hf-humo);
  --hf-tenue:rgba(242,241,239,.62);
  --hf-linea:rgba(227,188,114,.55);
  --hf-brillo:0 0 34px rgba(227,188,114,.28);

  background:transparent;
  text-align:center;
  font-family:'Jost',system-ui,sans-serif;
  font-weight:300;
  padding:8px;
}
/* variante para fondo claro (hueso, foto clara, papel) */
.hf--claro{
  --hf-firma:var(--hf-oro);
  --hf-texto:var(--hf-tinta);
  --hf-tenue:rgba(28,36,64,.6);
  --hf-linea:rgba(192,143,46,.6);
  --hf-brillo:none;
}
.hf *{box-sizing:border-box;margin:0;padding:0}

.hf__sobre{
  font-size:9.5px;
  letter-spacing:.4em;
  text-transform:uppercase;
  color:var(--hf-firma);
}

.hf__nombres{
  font-family:'Parisienne',cursive;
  font-weight:400;
  font-size:clamp(46px,13vw,86px);
  line-height:1.05;
  color:var(--hf-firma);
  text-shadow:var(--hf-brillo);
  margin:18px 0 6px;
}

.hf__fecha{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:26px;
  font-size:10px;
  letter-spacing:.34em;
  color:var(--hf-tenue);
}
.hf__fecha i{display:block;width:36px;height:1px;background:var(--hf-linea)}

.hf__cuenta{
  margin-top:34px;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:16px;
  letter-spacing:.06em;
  color:var(--hf-tenue);
}

/* entrada al cargar */
.hf__sobre,.hf__nombres,.hf__fecha,.hf__cuenta{
  opacity:0;
  transform:translateY(14px);
  animation:hf-entra .9s cubic-bezier(.25,.8,.3,1) forwards;
}
.hf__nombres{animation-delay:.15s}
.hf__fecha  {animation-delay:.45s}
.hf__cuenta {animation-delay:.65s}
@keyframes hf-entra{to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  .hf__sobre,.hf__nombres,.hf__fecha,.hf__cuenta{animation:none;opacity:1;transform:none}
}
</style>

<div class="hf">
  <p class="hf__sobre">7 de noviembre de 2026</p>
  <h1 class="hf__nombres">Dayona<br>y Javier</h1>
  <p class="hf__fecha"><i></i>NOS CASAMOS<i></i></p>
  <p class="hf__cuenta" data-hf-dias></p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  /* misma fecha y misma zona horaria que el contador */
  var BODA = new Date('2026-11-07T17:00:00-04:00');

  document.querySelectorAll('[data-hf-dias]').forEach(function (el) {
    var dias = Math.ceil((BODA - Date.now()) / 86400000);
    el.textContent = dias > 1  ? 'Faltan ' + dias + ' días'
                   : dias === 1 ? 'Falta 1 día'
                   : dias === 0 ? 'Es hoy'
                   : 'Gracias por acompañarnos';
  });
});
</script>
