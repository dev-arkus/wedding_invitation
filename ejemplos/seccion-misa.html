<style>
/* Sección "La misa" · diseño Duotono · prefijo .mis- */
.mis{
  --mis-tinta:#1C2440;
  --mis-oro:#C08F2E;
  --mis-champan:#E3BC72;
  --mis-humo:#F2F1EF;

  background:var(--mis-tinta);
  color:var(--mis-humo);
  font-family:'Jost',system-ui,sans-serif;
  font-weight:300;
  text-align:center;
  padding-bottom:52px;
  border-radius:4px;
  overflow:hidden;
}
.mis *{box-sizing:border-box;margin:0;padding:0}

.mis__foto{position:relative;height:clamp(250px,52vw,340px);overflow:hidden}
.mis__foto img{
  width:100%;height:100%;
  object-fit:cover;object-position:center 45%;
  display:block;
}
/* funde la parte baja de la foto con el fondo azul */
.mis__foto::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(rgba(28,36,64,0) 58%,var(--mis-tinta) 100%);
}

.mis__cuerpo{padding:34px 26px 0}

.mis__eyebrow{font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--mis-champan)}
.mis__lugar{
  font-family:'Italiana',Georgia,serif;font-weight:400;
  font-size:clamp(26px,7vw,40px);letter-spacing:.03em;line-height:1.2;
  margin:14px 0 16px;
}
.mis__dir{
  background:none;border:none;cursor:pointer;
  font-family:inherit;font-weight:300;font-size:14.5px;line-height:1.7;
  color:rgba(242,241,239,.62);
  max-width:320px;margin:0 auto;display:block;
  transition:color .25s;
}
.mis__dir:hover,.mis__dir:focus-visible{color:var(--mis-champan)}
.mis__hora{
  font-family:'Bodoni Moda',Georgia,serif;font-weight:400;
  font-size:32px;color:var(--mis-champan);margin:24px 0 30px;
}
.mis__btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 30px;border:1px solid var(--mis-champan);border-radius:2px;
  color:var(--mis-champan);background:transparent;text-decoration:none;
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  transition:background .25s,color .25s;
}
.mis__btn:hover,.mis__btn:focus-visible{background:var(--mis-champan);color:var(--mis-tinta)}
.mis__btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4}

.mis__copiado{
  margin-top:20px;height:14px;
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--mis-champan);opacity:0;transition:opacity .3s;
}
.mis__copiado--ver{opacity:1}

@media (prefers-reduced-motion:reduce){.mis *{transition:none!important}}
</style>

<script>
document.getElementById('misDir').addEventListener('click', function () {
  var texto = 'Basílica de Táriba, Carrera 5, frente a la Plaza Bolívar, Táriba, estado Táchira';
  var aviso = document.getElementById('misCopiado');
  function mostrar() {
    aviso.classList.add('mis__copiado--ver');
    setTimeout(function () { aviso.classList.remove('mis__copiado--ver'); }, 2200);
  }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(texto).then(mostrar);
  } else {
    var t = document.createElement('textarea');
    t.value = texto; document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove(); mostrar();
  }
});
</script>
