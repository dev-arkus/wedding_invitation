<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los esperamos · Dayona y Javier</title>

<!-- Si tu invitación ya carga fuentes, quita este link -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

<body>
<div class="contenedor">

<!-- ══════════════════════ COPIA DESDE AQUÍ ══════════════════════ -->
<style>
/* Sección "Los esperamos" · diseño Disco · prefijo .ds- */
.ds{
  --ds-fondo:#1C2440;
  --ds-champan:#E3BC72;
  --ds-humo:#F2F1EF;

  /* ── medidas ajustables ──
     figura: alto de la foto de los novios
     disco:  diámetro del círculo
     pie:    cuánto sobresalen los pies por debajo del círculo
     x:      corrimiento horizontal, si la pareja no está centrada en la foto */
  --ds-figura:min(420px,92vw);
  --ds-disco:min(272px,70vw);
  --ds-pie:44px;
  --ds-x:0px;

  background:var(--ds-fondo);
  color:var(--ds-humo);
  font-family:'Jost',system-ui,sans-serif;
  font-weight:400;
  text-align:center;
  padding:56px 24px 58px;
  border-radius:4px;
}
.ds *{box-sizing:border-box;margin:0;padding:0}

.ds__escena{
  position:relative;
  width:min(320px,80vw);
  height:var(--ds-figura);
  margin:0 auto;
  display:flex;align-items:flex-end;justify-content:center;
}

.ds__circulo{
  position:absolute;
  bottom:var(--ds-pie);
  left:50%;transform:translateX(-50%);
  width:var(--ds-disco);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#33406B,#212B4E);
  box-shadow:0 0 0 1px rgba(227,188,114,.6),
             0 0 0 12px rgba(227,188,114,.07);
}

.ds__pareja{
  position:relative;z-index:2;
  height:100%;width:auto;
  transform:translateX(var(--ds-x));
}

.ds__frase{
  position:relative;z-index:3;
  margin-top:30px;
  font-family:'Parisienne',cursive;font-weight:400;
  font-size:clamp(38px,10vw,58px);line-height:1.15;
  color:var(--ds-champan);
}

.ds__fecha{
  margin-top:12px;
  font-size:14px;letter-spacing:.28em;
  color:rgba(242,241,239,.55);
}
</style>

<section class="ds">
  <div class="ds__escena">
    <div class="ds__circulo"></div>

    <!-- ══ SUSTITUIR ══
         Cambia este <svg> de ejemplo por la foto sin fondo:
         <img class="ds__pareja" src="novios-sin-fondo.png" alt="Dayona y Javier">
         Luego ajusta arriba --ds-figura, --ds-pie y --ds-x hasta que
         la cabeza sobresalga por arriba y los pies pisen el borde de abajo. -->
    <svg class="ds__pareja" viewBox="0 0 300 420" aria-label="Dayona y Javier">
      <circle cx="112" cy="66" r="27" fill="#2A3457"/>
      <path d="M112 40c14 0 20 8 20 18 0 4-2 7-2 7s-4-9-18-9-18 9-18 9-2-3-2-7c0-10 6-18 20-18z" fill="#1E2740"/>
      <path d="M86 108c8-8 18-12 26-12s18 4 26 12l10 22-6 6-4-8v192h-52V128l-4 8-6-6z" fill="#2A3457"/>
      <path d="M112 120l8 8-8 12-8-12z" fill="#E8E4DC" opacity=".85"/>
      <path d="M112 132v186" stroke="#222B49" stroke-width="2"/>
      <circle cx="196" cy="74" r="25" fill="#C9BFA9"/>
      <path d="M196 49c16 0 24 10 22 24-2 12 4 14 4 14s-10 4-14-6c-3-8-12-10-12-10s-9 2-12 10c-4 10-14 6-14 6s6-2 4-14c-2-14 6-24 22-24z" fill="#8A7C63"/>
      <path d="M176 112c6 5 34 5 40 0l6 34c-8 6-44 6-52 0z" fill="#E8E4DC"/>
      <path d="M170 146c8 6 44 6 52 0l28 172c-32 9-74 9-106 0z" fill="#F2EFE8"/>
      <path d="M144 318c32 9 74 9 106 0" fill="none" stroke="#DED9CF" stroke-width="2"/>
      <path d="M196 118v28" stroke="#DED9CF" stroke-width="2"/>
    </svg>
  </div>

  <p class="ds__frase">Los esperamos</p>
  <p class="ds__fecha">07 · 11 · 2026</p>
</section>
<!-- ══════════════════════ HASTA AQUÍ ══════════════════════ -->

</div>
</body>
</html>
