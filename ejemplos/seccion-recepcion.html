<style>
/* Sección "La recepción" · diseño Franja · prefijo .rec- */
.rec{
  --rec-tinta:#1C2440;
  --rec-oro:#C08F2E;
  --rec-champan:#E3BC72;
  --rec-humo:#F2F1EF;

  position:relative;
  min-height:clamp(380px,72vw,460px);
  display:flex;align-items:flex-end;
  overflow:hidden;
  border-radius:4px;
  font-family:'Jost',system-ui,sans-serif;
  font-weight:300;
  color:var(--rec-humo);
}
.rec *{box-sizing:border-box;margin:0;padding:0}

.rec__fondo{position:absolute;inset:0}
.rec__fondo img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block}
.rec__fondo::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(rgba(28,36,64,.15),rgba(28,36,64,.5));
}

.rec__cinta{
  position:relative;z-index:2;width:100%;
  background:rgba(28,36,64,.88);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  border-top:1px solid rgba(227,188,114,.45);
  padding:30px clamp(22px,5vw,40px);
  display:flex;align-items:center;justify-content:space-between;
  gap:22px;flex-wrap:wrap;
}
.rec__izq{text-align:left;min-width:200px}
.rec__eyebrow{font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--rec-champan)}
.rec__lugar{
  font-family:'Italiana',Georgia,serif;font-weight:400;
  font-size:clamp(22px,4.8vw,32px);letter-spacing:.03em;line-height:1.2;
  margin:10px 0 8px;
}
.rec__dir{font-size:13.5px;line-height:1.6;color:rgba(242,241,239,.6)}

.rec__der{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rec__hora{font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:30px;color:var(--rec-champan)}

.rec__btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 26px;border:1px solid var(--rec-champan);border-radius:2px;
  color:var(--rec-champan);background:transparent;text-decoration:none;
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  transition:background .25s,color .25s;
}
.rec__btn:hover,.rec__btn:focus-visible{background:var(--rec-champan);color:var(--rec-tinta)}
.rec__btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4}

/* en móvil la franja se apila y todo va a la izquierda */
@media (max-width:540px){
  .rec__cinta{flex-direction:column;align-items:flex-start;gap:18px}
  .rec__der{width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){.rec *{transition:none!important}}
</style>
