<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmación de asistencia · Dayona y Javier</title>

<!-- Si tu invitación ya carga fuentes, quita este link -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* solo para esta página de prueba */
  body{margin:0;background:#080D1C;padding:40px 16px}
  .contenedor{max-width:560px;margin:0 auto}
</style>
</head>
<body>
<div class="contenedor">

<!-- ══════════════════════ COPIA DESDE AQUÍ ══════════════════════ -->
<style>
/* Confirmación de asistencia · diseño "Pases" · prefijo .ps- */
.ps{
  --ps-fondo:#1C2440;
  --ps-oro:#C08F2E;
  --ps-champan:#E3BC72;
  --ps-humo:#F2F1EF;

  background:var(--ps-fondo);
  color:var(--ps-humo);
  font-family:'Jost',system-ui,sans-serif;
  font-weight:400;
  padding:44px clamp(18px,5vw,38px) 46px;
  border-radius:4px;
}
.ps *{box-sizing:border-box;margin:0;padding:0}

/* ── encabezado ── */
.ps__cabeza{text-align:center;margin-bottom:32px}
.ps__adorno{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.ps__adorno i{display:block;width:46px;height:1px;background:var(--ps-champan);opacity:.5}
.ps__adorno b{display:block;width:6px;height:6px;background:var(--ps-champan);transform:rotate(45deg)}
.ps__epigrafe{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;color:var(--ps-champan)}
.ps__titulo{font-family:'Italiana',Georgia,serif;font-weight:400;font-size:clamp(26px,6.2vw,36px);letter-spacing:.03em;margin:10px 0 14px}
.ps__ayuda{font-size:17px;line-height:1.7;color:rgba(242,241,239,.65);max-width:400px;margin:0 auto}

/* ── cada pase ── */
.ps__lista{display:grid;gap:16px}
.ps__pase{
  display:grid;grid-template-columns:74px 1fr;
  background:rgba(242,241,239,.05);
  border:1px solid rgba(227,188,114,.25);
  border-radius:5px;overflow:hidden;
  transition:opacity .22s,border-color .22s,box-shadow .22s;
}
.ps__pase[data-estado="si"]{border-color:var(--ps-champan)}
.ps__pase[data-estado="no"]{opacity:.58}
.ps__pase[data-aviso]{box-shadow:0 0 0 3px rgba(227,188,114,.35)}

.ps__talon{
  background:rgba(227,188,114,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:16px 8px;position:relative;transition:background .22s,color .22s;
}
.ps__pase[data-estado="si"] .ps__talon{background:var(--ps-champan);color:var(--ps-fondo)}
/* la perforación */
.ps__talon::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:2px;
  background:repeating-linear-gradient(var(--ps-fondo) 0 6px,transparent 6px 12px);
}
.ps__talon em{font-style:normal;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.ps__talon strong{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px}

.ps__datos{padding:20px 18px}
.ps__nombre{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:24px;line-height:1.25}
.ps__nota{font-size:15px;color:rgba(242,241,239,.5);margin-top:3px}

.ps__par{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ps__op{
  min-height:60px;padding:14px 10px;
  border:2px solid rgba(227,188,114,.4);border-radius:4px;background:transparent;
  color:var(--ps-humo);font-family:'Jost',sans-serif;font-size:17px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:background .18s,border-color .18s,color .18s;
}
.ps__op:hover{border-color:var(--ps-champan)}
.ps__op svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;flex:0 0 auto;opacity:0;transition:opacity .18s}
.ps__op[aria-pressed="true"] svg{opacity:1}
.ps__op[data-si][aria-pressed="true"]{background:var(--ps-champan);border-color:var(--ps-champan);color:var(--ps-fondo)}
.ps__op[data-no][aria-pressed="true"]{background:rgba(242,241,239,.18);border-color:rgba(242,241,239,.6);color:#fff}

/* ── pie ── */
.ps__pie{margin-top:30px;text-align:center}
.ps__resumen{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;color:rgba(242,241,239,.6);min-height:26px;margin-bottom:16px}
.ps__guardar{
  width:100%;max-width:420px;min-height:64px;border:none;border-radius:4px;
  background:var(--ps-champan);color:var(--ps-fondo);
  font-family:'Jost',sans-serif;font-size:19px;font-weight:500;cursor:pointer;transition:background .2s;
}
.ps__guardar:hover{background:#EFCE8C}

/* ── ya guardado ── */
.ps__listo{display:none;text-align:center;padding:26px 0 10px}
.ps__sello{width:64px;height:64px;border-radius:50%;margin:0 auto 20px;background:var(--ps-champan);
  display:flex;align-items:center;justify-content:center}
.ps__sello svg{width:30px;height:30px;fill:none;stroke:var(--ps-fondo);stroke-width:2.6}
.ps__listo b{display:block;font-family:'Italiana',Georgia,serif;font-weight:400;font-size:30px;margin-bottom:12px}
.ps__listo p{font-size:17px;line-height:1.75;color:rgba(242,241,239,.65);max-width:400px;margin:0 auto}
.ps__listo button{margin-top:24px;min-height:52px;padding:0 28px;border:2px solid rgba(242,241,239,.35);
  border-radius:4px;background:transparent;color:var(--ps-humo);
  font-family:'Jost',sans-serif;font-size:16px;font-weight:500;cursor:pointer}
.ps--guardado .ps__listo{display:block}
.ps--guardado .ps__lista,.ps--guardado .ps__pie,.ps--guardado .ps__ayuda{display:none}

@media (max-width:430px){
  .ps__pase{grid-template-columns:62px 1fr}
  .ps__talon strong{font-size:23px}
  .ps__datos{padding:18px 15px}
  .ps__par{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.ps *{transition:none!important}}
</style>

<section class="ps" id="ps">
  <div class="ps__cabeza">
    <div class="ps__adorno"><i></i><b></b><i></i></div>
    <p class="ps__epigrafe">Su invitación incluye</p>
    <h2 class="ps__titulo" id="psTitulo"></h2>
    <p class="ps__ayuda">Marque quién puede acompañarnos el sábado 7 de noviembre.</p>
  </div>

  <div class="ps__lista" id="psLista"></div>

  <div class="ps__pie">
    <p class="ps__resumen" id="psResumen"></p>
    <button class="ps__guardar" id="psGuardar">Guardar mi respuesta</button>
  </div>

  <div class="ps__listo">
    <div class="ps__sello"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
    <b>¡Gracias!</b>
    <p id="psGracias"></p>
    <button id="psEditar">Cambiar mi respuesta</button>
  </div>
</section>

<script>
(function () {
  /* ═══════ ESTO LO ARMAS TÚ CON EL TOKEN DEL INVITADO ═══════ */
  var INVITADOS = [
    { id: 'p1', nombre: 'Carlos Rodríguez',         nota: 'Adulto' },
    { id: 'p2', nombre: 'María Pérez de Rodríguez', nota: 'Adulto' },
    { id: 'p3', nombre: 'Sofía Rodríguez',          nota: 'Niña' }
  ];
  /* ═════════════════════════════════════════════════════════ */

  var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
  var EQUIS = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  var raiz    = document.getElementById('ps');
  var lista   = document.getElementById('psLista');
  var resumen = document.getElementById('psResumen');
  var total   = INVITADOS.length;
  var estado  = {};

  document.getElementById('psTitulo').textContent = total === 1 ? '1 pase' : total + ' pases';

  INVITADOS.forEach(function (p, i) {
    estado[p.id] = null;
    lista.insertAdjacentHTML('beforeend',
      '<div class="ps__pase" data-invitado="' + p.id + '">' +
        '<div class="ps__talon"><em>Pase</em><strong>' + (i + 1) + '</strong></div>' +
        '<div class="ps__datos">' +
          '<div class="ps__nombre">' + p.nombre + '</div>' +
          (p.nota ? '<div class="ps__nota">' + p.nota + '</div>' : '') +
          '<div class="ps__par" role="group" aria-label="Respuesta de ' + p.nombre + '">' +
            '<button class="ps__op" data-si aria-pressed="false">' + CHECK + 'Sí asiste</button>' +
            '<button class="ps__op" data-no aria-pressed="false">' + EQUIS + 'No podrá</button>' +
          '</div>' +
        '</div>' +
      '</div>');
  });

  function refrescar() {
    var faltan = INVITADOS.filter(function (p) { return estado[p.id] === null; }).length;
    var van    = INVITADOS.filter(function (p) { return estado[p.id] === 'si'; }).length;
    if (faltan) { resumen.textContent = ''; return; }   // sin mensajes hasta terminar
    resumen.textContent = van === 0     ? 'Ninguno podrá asistir'
                        : van === total ? (total === 1 ? 'Confirmado' : 'Asisten los ' + total)
                        : 'Asisten ' + van + ' de ' + total;
  }

  lista.addEventListener('click', function (e) {
    var op = e.target.closest('[data-si],[data-no]');
    if (!op) return;
    var pase  = op.closest('[data-invitado]');
    var valor = op.hasAttribute('data-si') ? 'si' : 'no';

    estado[pase.dataset.invitado] = valor;
    pase.dataset.estado = valor;
    pase.removeAttribute('data-aviso');
    pase.querySelectorAll('[data-si],[data-no]').forEach(function (b) {
      b.setAttribute('aria-pressed', (b.hasAttribute('data-si') ? 'si' : 'no') === valor);
    });
    refrescar();
  });

  document.getElementById('psGuardar').addEventListener('click', function () {
    /* si algo quedó sin responder, señalamos el pase en vez de regañar con texto */
    var pendientes = INVITADOS.filter(function (p) { return estado[p.id] === null; });
    if (pendientes.length) {
      pendientes.forEach(function (p) {
        lista.querySelector('[data-invitado="' + p.id + '"]').setAttribute('data-aviso', '');
      });
      lista.querySelector('[data-invitado="' + pendientes[0].id + '"]')
           .scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    var van = INVITADOS.filter(function (p) { return estado[p.id] === 'si'; });
    document.getElementById('psGracias').textContent = van.length
      ? 'Los esperamos el sábado 7 de noviembre: ' +
        van.map(function (p) { return p.nombre.split(' ')[0]; }).join(', ') + '.'
      : 'Gracias por avisarnos. Los vamos a extrañar.';
    raiz.classList.add('ps--guardado');

    /* aquí va el envío a tu Apps Script:
       fetch(URL, {
         method: 'POST',
         headers: { 'Content-Type': 'text/plain;charset=utf-8' },
         body: JSON.stringify({ token: TOKEN, respuestas: estado })
       }); */
  });

  document.getElementById('psEditar').addEventListener('click', function () {
    raiz.classList.remove('ps--guardado');
  });

  refrescar();
})();
</script>
<!-- ══════════════════════ HASTA AQUÍ ══════════════════════ -->

</div>
</body>
</html>
