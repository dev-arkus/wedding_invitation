<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon: la estrella de cuatro puntas del hero, no el monograma.
    A 16px "D & J" con filete es una mancha ilegible; esta forma se lee a
    cualquier tamaño y es literalmente el elemento firma de la invitación.
  -->
